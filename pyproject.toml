[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudstrike-lab"
version = "0.1.0"
description = "Safe AWS attack-path discovery, validation, detection, and remediation lab"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["ruff>=0.5"]

[project.scripts]
cloudstrike = "cloudstrike.cli:main"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.setuptools.package-data]
cloudstrike = ["data/iam-passrole/inventory.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
